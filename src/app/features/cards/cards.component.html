<div class="page-container">
  <h1>All Cards</h1>
  <p>Browse the catalog and add cards to your wallet or wishlist</p>

  <app-search-bar (searchChange)="searchQuery.set($event)" />

  <div class="filters">
    <select class="input" aria-label="Issuer" [value]="filters().issuer" (change)="setFilter('issuer', $any($event.target).value)">
      <option value="">All issuers</option>
      @for (issuer of issuers; track issuer) {
        <option [value]="issuer">{{ issuer }}</option>
      }
    </select>
    <select class="input" aria-label="Network" [value]="filters().network" (change)="setFilter('network', $any($event.target).value)">
      <option value="">All networks</option>
      @for (network of networks; track network) {
        <option [value]="network">{{ network }}</option>
      }
    </select>
    <select class="input" aria-label="Annual fee" [value]="filters().fee" (change)="setFilter('fee', $any($event.target).value)">
      <option value="">Any annual fee</option>
      <option value="none">No annual fee</option>
      <option value="paid">Has annual fee</option>
    </select>
    <select class="input" aria-label="Card type" [value]="filters().type" (change)="setFilter('type', $any($event.target).value)">
      <option value="">Personal & business</option>
      <option value="personal">Personal</option>
      <option value="business">Business</option>
    </select>
    @if (hasFilters()) {
      <button class="btn btn-small" (click)="clearFilters()">Clear filters</button>
    }
  </div>

  <app-card-list
    mode="catalog"
    [items]="items()"
    [ownedCardIds]="ownedCardIds()"
    [wishlistedCardIds]="wishlistedCardIds()"
    emptyMessage="No cards match your search and filters"
    (open)="selected.set($event.card)"
    (add)="startAdding($event.card)"
    (toggleWishlist)="onToggleWishlist($event)"
  />

  @if (selected(); as card) {
    <app-card-detail [card]="card" (closed)="selected.set(null)" (add)="startAdding(card)" />
  }

  @if (adding(); as card) {
    <app-add-card-dialog [card]="card" (added)="onAdded($event)" (closed)="adding.set(null)" />
  }
</div>
