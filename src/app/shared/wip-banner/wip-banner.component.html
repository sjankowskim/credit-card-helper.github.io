@if (visible()) {
  <div class="wip-banner" role="note">
    <p>
      <strong>Work in progress.</strong> Credit Card Helper is still being built, so expect rough edges.
      Found a bug or have an idea?
      <a [href]="issuesUrl" target="_blank" rel="noopener">Open an issue on GitHub</a>.
    </p>
    <button type="button" class="dismiss" (click)="dismiss()" aria-label="Dismiss this notice" title="Dismiss">✕</button>
  </div>
}
