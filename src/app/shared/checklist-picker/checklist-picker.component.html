<app-modal [title]="title()" [width]="groups().length > 1 ? 'wide' : 'narrow'" (closed)="closed.emit()">
  @if (note()) {
    <p class="muted">{{ note() }}</p>
  }
  <div class="groups">
    @for (group of groups(); track group.key) {
      <fieldset class="group">
        @if (group.title) {
          <legend>{{ group.title }}</legend>
        }
        @for (item of group.items; track item.id) {
          <label class="checkbox">
            <input
              type="checkbox"
              [checked]="group.checked.includes(item.id)"
              [disabled]="group.required?.has(item.id)"
              (change)="toggle.emit({ key: group.key, id: item.id, checked: $any($event.target).checked })"
            />
            {{ item.label }}
          </label>
        }
        <button class="btn btn-small" [disabled]="group.isDefault" (click)="reset.emit(group.key)">Reset to default</button>
      </fieldset>
    }
  </div>
  <div modal-actions class="modal-actions">
    <button class="btn btn-primary" (click)="closed.emit()">Done</button>
  </div>
</app-modal>
