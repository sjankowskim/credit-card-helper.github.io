<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-brand">
      <a routerLink="/" class="brand-link">Credit Card Helper</a>
    </div>
    <ul class="navbar-nav">
      @for (item of navItems; track item.path) {
        <li class="nav-item">
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            class="nav-link"
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </div>
</nav>
